---
- name: Ensure mount point exists
  loop: "{{ samba_shares }}"
  ansible.builtin.file:
    path: "{{ item.mount_point }}"
    state: directory
    owner: root
    group: root
    mode: '0777'

- name: Add Samba share entry to /etc/fstab
  loop: "{{ samba_shares }}"
  ansible.builtin.lineinfile:
    path: /etc/fstab
    line: "//{{ item.server }}{{ item.share_path }} {{ item.mount_point }} cifs rw,_netdev,credentials=/etc/samba/{{ item.server }}.smbclient,iocharset=utf8,gid=1000,uid=1000 0 0"
    state: present
